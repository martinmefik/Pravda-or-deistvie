<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Правда или Наказание · для двоих</title>
  <style>
    :root {
      --bg: #0f0a14;
      --bg-light: #1a1122;
      --bg-card: rgba(26, 17, 34, 0.9);
      --primary: #ff4d7d;
      --primary-light: #ff8ba7;
      --primary-dark: #c4456e;
      --accent: #ffd166;
      --text: #fbe9f0;
      --text-soft: #c9b0bd;
      --text-muted: #8a6a7a;
      --border: rgba(255, 77, 125, 0.3);
      --border-strong: rgba(255, 77, 125, 0.6);
      --glow: rgba(255, 77, 125, 0.2);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      --radius: 24px;
      --radius-sm: 16px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(160deg, #0f0a14 0%, #1a1122 40%, #0f0a14 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 0% 20%, rgba(255, 77, 125, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 80%, rgba(196, 69, 110, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 0%, rgba(255, 139, 167, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: gradientShift 10s ease-in-out infinite alternate;
    }

    @keyframes gradientShift {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 35px 30px;
      box-shadow: var(--shadow), 0 0 80px var(--glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all var(--transition);
    }

    .screen {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff8ba7, #ff4d7d, #c4456e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-subtitle {
      text-align: center;
      color: var(--text-soft);
      margin-bottom: 30px;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.5s;
      transform: translate(-50%, -50%);
    }

    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d7d, #c4456e);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 77, 125, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 77, 125, 0.55);
      background: linear-gradient(135deg, #ff5e8a, #d4557e);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text-soft);
      box-shadow: none;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--text);
      background: rgba(255, 77, 125, 0.05);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-back {
      display: inline-block;
      width: auto;
      padding: 10px 20px;
      font-size: 0.9rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      transition: all var(--transition);
      border-radius: 30px;
      margin-bottom: 20px;
    }

    .btn-back:hover {
      border-color: var(--primary);
      color: var(--text);
      background: rgba(255, 77, 125, 0.05);
    }

    .mode-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .mode-card {
      flex: 1;
      min-width: 150px;
      padding: 20px 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .mode-card:hover {
      border-color: var(--primary);
      background: rgba(255, 77, 125, 0.06);
    }

    .mode-card.selected {
      border-color: var(--primary);
      background: rgba(255, 77, 125, 0.1);
      box-shadow: 0 0 25px rgba(255, 77, 125, 0.2);
    }

    .mode-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .mode-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .mode-desc {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-soft);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: all var(--transition);
      letter-spacing: 0.3px;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(255, 77, 125, 0.2);
      background: rgba(255, 77, 125, 0.05);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    .wheel-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 20px auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        var(--primary) 0deg 180deg,
        #ff8ba7 180deg 360deg
      );
      position: relative;
      transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 0 40px rgba(255, 77, 125, 0.5), inset 0 0 30px rgba(0, 0, 0, 0.2);
      border: 4px solid rgba(255, 255, 255, 0.2);
    }

    .wheel-half {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      padding: 20px;
      text-align: center;
    }

    .wheel-half.left {
      left: 0;
      border-radius: 50% 0 0 50%;
    }

    .wheel-half.right {
      right: 0;
      border-radius: 0 50% 50% 0;
    }

    .wheel-pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
      z-index: 2;
    }

    .wheel-btn {
      display: block;
      margin: 10px auto 0;
      padding: 14px 28px;
      font-size: 1rem;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      background: rgba(255, 77, 125, 0.12);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .turn-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 12px var(--primary);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    .skip-counter {
      font-size: 0.85rem;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 25px 20px;
      margin: 20px 0;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 500;
      line-height: 1.6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      word-wrap: break-word;
      transition: all var(--transition);
    }

    .card.pop {
      animation: cardPop 0.4s ease;
    }

    @keyframes cardPop {
      0% { transform: scale(0.92); opacity: 0; }
      60% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }

    .card.super-task {
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.08);
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
      animation: superPop 0.6s ease;
    }

    @keyframes superPop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .card.loading {
      animation: pulse 1.5s infinite;
      color: var(--text-muted);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .action-buttons .btn {
      flex: 1;
      min-width: 140px;
      margin-bottom: 0;
      font-size: 0.9rem;
      padding: 14px 18px;
    }

    .scrollable {
      max-height: 75vh;
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }

    .scrollable::-webkit-scrollbar {
      width: 6px;
    }

    .scrollable::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    .scrollable::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .btn-reset {
      margin-top: 16px;
      padding: 12px 20px;
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      .app {
        padding: 25px 18px;
        border-radius: 20px;
      }
      .app-title {
        font-size: 1.8rem;
      }
      .card {
        font-size: 1.15rem;
        padding: 18px 15px;
      }
      .wheel-container {
        width: 180px;
        height: 180px;
      }
      .wheel-half {
        font-size: 1rem;
        padding: 10px;
      }
      .mode-grid {
        gap: 10px;
      }
      .mode-card {
        padding: 15px 10px;
        min-width: 100px;
      }
      .btn {
        padding: 14px 18px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="scrollable">
      <!-- ЭКРАН 1: ВВОД ИМЁН -->
      <div id="screen-names" class="screen active">
        <h1 class="app-title">Правда или Наказание</h1>
        <p class="app-subtitle">Представьтесь, пожалуйста</p>
        <div class="input-group">
          <label class="input-label">Имя первого игрока</label>
          <input type="text" id="input-name1" class="input-field" placeholder="Введите имя" maxlength="20" oninput="checkNames()">
        </div>
        <div class="input-group">
          <label class="input-label">Имя второго игрока</label>
          <input type="text" id="input-name2" class="input-field" placeholder="Введите имя" maxlength="20" oninput="checkNames()">
        </div>
        <button class="btn btn-primary" id="btn-names-next" disabled onclick="goToMode()">Продолжить</button>
      </div>

      <!-- ЭКРАН 2: ВЫБОР РЕЖИМА -->
      <div id="screen-mode" class="screen">
        <button class="btn-back" onclick="goBackToNames()">← Назад</button>
        <h1 class="app-title">Выберите режим</h1>
        <p class="app-subtitle">Как будете играть?</p>
        <div class="mode-grid">
          <div class="mode-card" data-mode="regular" onclick="selectMode('regular')">
            <div class="mode-icon">💖</div>
            <div class="mode-name">Обычная</div>
            <div class="mode-desc">Нежные и романтичные</div>
          </div>
          <div class="mode-card" data-mode="adult" onclick="selectMode('adult')">
            <div class="mode-icon">🔥</div>
            <div class="mode-name">18+</div>
            <div class="mode-desc">С огоньком</div>
          </div>
        </div>
        <button class="btn btn-primary" id="btn-mode-next" disabled onclick="goToWheel()">Продолжить</button>
      </div>

      <!-- ЭКРАН 3: РУЛЕТКА (только для обычного режима) -->
      <div id="screen-wheel" class="screen">
        <button class="btn-back" onclick="goBackToMode()">← Назад</button>
        <h1 class="app-title">Кто начнёт?</h1>
        <p class="app-subtitle">Крутите барабан</p>
        <div class="wheel-container">
          <div class="wheel-pointer">▼</div>
          <div class="wheel" id="wheel">
            <div class="wheel-half left" id="wheel-name1">Игрок 1</div>
            <div class="wheel-half right" id="wheel-name2">Игрок 2</div>
          </div>
        </div>
        <button class="btn btn-primary wheel-btn" id="btn-spin" onclick="spinWheel()">Крутить</button>
        <p id="wheel-result" style="text-align: center; margin-top: 12px; font-weight: 600;"></p>
        <button class="btn btn-primary" id="btn-wheel-continue" style="display: none;" onclick="goToGame()">Перейти к игре →</button>
      </div>

      <!-- ЭКРАН 4: ИГРА -->
      <div id="screen-game" class="screen">
        <div class="game-header">
          <div class="turn-indicator">
            <span class="turn-dot"></span>
            <span id="current-turn-name">—</span>
          </div>
          <span class="skip-counter" id="skip-counter">Пропуски: 3/3</span>
        </div>
        <div class="card" id="card-text">Нажмите кнопку ниже</div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btn-truth" onclick="drawCard('truth')">💖 Правда</button>
          <button class="btn btn-primary" id="btn-dare" onclick="drawCard('dare')">🔥 Наказание</button>
        </div>
        <div class="action-buttons" id="extra-actions" style="display: none;">
          <button class="btn btn-secondary" id="btn-skip" onclick="skipCard()">Пропустить</button>
          <button class="btn btn-primary" id="btn-complete" onclick="completeCard()">Выполнил(а) ✓</button>
        </div>
        <button class="btn btn-secondary btn-reset" onclick="resetAll()">🔄 Начать заново</button>
      </div>
    </div>
  </div>

          styles: [
            'страстно', 'грубо', 'нежно', 'медленно',
            'быстро', 'игриво', 'дерзко', 'чувственно',
            'агрессивно', 'томно'
          ],
          additions: [
            'и не останавливайся', 'до стона', 'глядя в глаза',
            'с закрытыми глазами', 'без предупреждения',
            'на счёт три', 'пока {name} не попросит',
            'и скажи грязную фразу'
          ],
          places: [
            'на кровати', 'в душе', 'на кухне', 'на столе',
            'у стены', 'на полу', 'в машине', 'на балконе'
          ]
        }
      }
    };

    // ====== СОСТОЯНИЕ ======
    let gameState = {
      mode: null,
      name1: '',
      name2: '',
      currentTurn: 1,
      skipCount: 0,
      maxSkips: 3,
      usedCards: {
        truth: new Set(),
        dare: new Set()
      },
      currentCardType: null,
      currentCardText: '',
      apiAvailable: true
    };

    // ====== API ГЕНЕРАЦИЯ ======
    async function fetchFromAPI(type) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      
      try {
        const url = type === 'truth' 
          ? 'https://api.truthordarebot.xyz/v1/truth'
          : 'https://api.truthordarebot.xyz/v1/dare';
        
        const response = await fetch(url, { signal: controller.signal });
        const data = await response.json();
        
        clearTimeout(timeout);
        
        if (data && data.question) {
          return data.question;
        }
        throw new Error('No question');
      } catch (error) {
        clearTimeout(timeout);
        throw error;
      }
    }

    // ====== ЛОКАЛЬНАЯ ГЕНЕРАЦИЯ ======
    function generateLocalCard(type) {
      const modeData = generationData[gameState.mode];
      const typeData = modeData[type];
      const otherName = gameState.currentTurn === 1 ? gameState.name2 : gameState.name1;
      
      let card = '';
      let attempts = 0;
      const maxAttempts = 100;
      
      do {
        card = generateLocalCardText(type, typeData, otherName);
        attempts++;
      } while (gameState.usedCards[type].has(card) && attempts < maxAttempts);
      
      gameState.usedCards[type].add(card);
      return card;
    }

    function generateLocalCardText(type, data, otherName) {
      if (type === 'truth') {
        const templates = [
          () => {
            const start = data.starts[Math.floor(Math.random() * data.starts.length)];
            const subject = data.subjects[Math.floor(Math.random() * data.subjects.length)];
            const ending = data.endings[Math.floor(Math.random() * data.endings.length)];
            return `${start} ${subject} ${ending}`;
          },
          () => {
            const start = data.starts[Math.floor(Math.random() * data.starts.length)];
            const action = data.actions[Math.floor(Math.random() * data.actions.length)];
            const ending = data.endings[Math.floor(Math.random() * data.endings.length)];
            return `${start} ${action} ${ending}`;
          }
        ];
        
        const template = templates[Math.floor(Math.random() * templates.length)];
        let result = template();
        result = result.replace(/{name}/g, otherName);
        result = result.charAt(0).toUpperCase() + result.slice(1);
        return result;
      } else {
        const templates = [
          () => {
            const action = data.actions[Math.floor(Math.random() * data.actions.length)];
            const target = data.targets[Math.floor(Math.random() * data.targets.length)];
            const style = data.styles[Math.floor(Math.random() * data.styles.length)];
            return `${action} ${target} ${style}`;
          },
          () => {
            const action = data.actions[Math.floor(Math.random() * data.actions.length)];
            const target = data.targets[Math.floor(Math.random() * data.targets.length)];
            const addition = data.additions[Math.floor(Math.random() * data.additions.length)];
            return `${action} ${target} ${addition}`;
          },
          () => {
            const action = data.actions[Math.floor(Math.random() * data.actions.length)];
            const place = data.places[Math.floor(Math.random() * data.places.length)];
            const style = data.styles[Math.floor(Math.random() * data.styles.length)];
            return `${action} ${otherName} ${place} ${style}`;
          }
        ];
        
        const template = templates[Math.floor(Math.random() * templates.length)];
        let result = template();
        result = result.replace(/{name}/g, otherName);
        result = result.charAt(0).toUpperCase() + result.slice(1);
        return result;
      }
    }

    // ====== ГИБРИДНАЯ ГЕНЕРАЦИЯ ======
    async function generateCard(type) {
      const cardEl = document.getElementById('card-text');
      cardEl.className = 'card loading';
      cardEl.textContent = '⏳ Генерация...';
      
      // Пробуем API
      if (gameState.apiAvailable) {
        try {
          const apiCard = await fetchFromAPI(type);
          
          // Проверяем на повтор
          if (!gameState.usedCards[type].has(apiCard)) {
            gameState.usedCards[type].add(apiCard);
            gameState.currentCardType = type;
            gameState.currentCardText = apiCard;
            
            cardEl.textContent = apiCard;
            cardEl.className = 'card pop';
            void cardEl.offsetWidth;
            
            document.getElementById('extra-actions').style.display = 'flex';
            return;
          }
        } catch (error) {
          // API недоступен, переключаемся на локальную генерацию
          gameState.apiAvailable = false;
        }
      }
      
      // Локальная генерация
      const localCard = generateLocalCard(type);
      gameState.currentCardType = type;
      gameState.currentCardText = localCard;
      
      cardEl.textContent = localCard;
      cardEl.className = 'card pop';
      void cardEl.offsetWidth;
      
      document.getElementById('extra-actions').style.display = 'flex';
    }

    // ====== ЭКРАНЫ ======
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // ====== ИМЕНА ======
    function checkNames() {
      const n1 = document.getElementById('input-name1').value.trim();
      const n2 = document.getElementById('input-name2').value.trim();
      document.getElementById('btn-names-next').disabled = !(n1 && n2);
      if (n1 && n2) {
        gameState.name1 = n1;
        gameState.name2 = n2;
      }
    }

    function goToMode() {
      const n1 = document.getElementById('input-name1').value.trim();
      const n2 = document.getElementById('input-name2').value.trim();
      if (!n1 || !n2) return;
      gameState.name1 = n1;
      gameState.name2 = n2;
      showScreen('screen-mode');
    }

    function goBackToNames() {
      showScreen('screen-names');
      document.getElementById('input-name1').value = gameState.name1 || '';
      document.getElementById('input-name2').value = gameState.name2 || '';
    }

    // ====== РЕЖИМ ======
    function selectMode(mode) {
      gameState.mode = mode;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-mode-next').disabled = false;
    }

    function goToWheel() {
      if (!gameState.mode) return;
      
      if (gameState.mode === 'adult') {
        gameState.currentTurn = Math.random() > 0.5 ? 1 : 2;
        goToGame();
      } else {
        document.getElementById('wheel-name1').textContent = gameState.name1;
        document.getElementById('wheel-name2').textContent = gameState.name2;
        document.getElementById('wheel-result').textContent = '';
        document.getElementById('btn-wheel-continue').style.display = 'none';
        document.getElementById('btn-spin').style.display = 'block';
        document.getElementById('wheel').style.transform = 'rotate(0deg)';
        showScreen('screen-wheel');
      }
    }

    function goBackToMode() {
      showScreen('screen-mode');
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
    }

    // ====== РУЛЕТКА ======
    let wheelSpinning = false;

    function spinWheel() {
      if (wheelSpinning) return;
      wheelSpinning = true;
      
      const wheel = document.getElementById('wheel');
      const resultEl = document.getElementById('wheel-result');
      const btnSpin = document.getElementById('btn-spin');
      const btnContinue = document.getElementById('btn-wheel-continue');
      
      btnSpin.disabled = true;
      resultEl.textContent = '...';
      
      const spins = 5 + Math.floor(Math.random() * 4);
      const extraAngle = Math.random() * 360;
      const totalRotation = spins * 360 + extraAngle;
      
      wheel.style.transform = `rotate(${totalRotation}deg)`;
      
      setTimeout(() => {
        const finalAngle = totalRotation % 360;
        const winner = finalAngle < 180 ? 1 : 2;
        
        gameState.currentTurn = winner;
        
        if (winner === 1) {
          resultEl.textContent = `🎉 Начинает ${gameState.name1}!`;
        } else {
          resultEl.textContent = `🎉 Начинает ${gameState.name2}!`;
        }
        
        btnSpin.style.display = 'none';
        btnContinue.style.display = 'block';
        wheelSpinning = false;
      }, 3200);
    }

    function goToGame() {
      document.getElementById('current-turn-name').textContent = 
        gameState.currentTurn === 1 ? gameState.name1 : gameState.name2;
      updateSkipCounter();
      document.getElementById('extra-actions').style.display = 'none';
      document.getElementById('card-text').textContent = 'Нажмите «Правда» или «Наказание»';
      document.getElementById('card-text').className = 'card';
      showScreen('screen-game');
    }

    // ====== ИГРА ======
    function drawCard(type) {
      generateCard(type);
    }

    function skipCard() {
      if (gameState.skipCount >= gameState.maxSkips - 1) {
        if (gameState.mode === 'adult') {
          const otherName = gameState.currentTurn === 1 ? gameState.name2 : gameState.name1;
          const cardEl = document.getElementById('card-text');
          cardEl.textContent = `🔥 СУПЕР-ЗАДАНИЕ! ${gameState.currentTurn === 1 ? gameState.name1 : gameState.name2}, сделай ${otherName} минет или куни!`;
          cardEl.className = 'card super-task';
          cardEl.classList.add('pop');
          
          gameState.skipCount++;
          updateSkipCounter();
          document.getElementById('btn-skip').disabled = true;
          return;
        }
      }
      
      if (gameState.skipCount >= gameState.maxSkips) {
        return;
      }
      
      gameState.skipCount++;
      updateSkipCounter();
      
      generateCard(gameState.currentCardType || 'truth');
    }

    function completeCard() {
      gameState.skipCount = 0;
      updateSkipCounter();
      document.getElementById('btn-skip').disabled = false;
      
      gameState.currentTurn = gameState.currentTurn === 1 ? 2 : 1;
      document.getElementById('current-turn-name').textContent = 
        gameState.currentTurn === 1 ? gameState.name1 : gameState.name2;
      
      document.getElementById('extra-actions').style.display = 'none';
      document.getElementById('card-text').textContent = 'Нажмите «Правда» или «Наказание»';
      document.getElementById('card-text').className = 'card';
    }

    function updateSkipCounter() {
      const remaining = gameState.maxSkips - gameState.skipCount;
      document.getElementById('skip-counter').textContent = `Пропуски: ${remaining}/${gameState.maxSkips}`;
      if (remaining <= 0) {
        document.getElementById('btn-skip').disabled = true;
      } else {
        document.getElementById('btn-skip').disabled = false;
      }
    }

    // ====== СБРОС ======
    function resetAll() {
      gameState.mode = null;
      gameState.name1 = '';
      gameState.name2 = '';
      gameState.currentTurn = 1;
      gameState.skipCount = 0;
      gameState.usedCards = { truth: new Set(), dare: new Set() };
      gameState.currentCardType = null;
      gameState.currentCardText = '';
      gameState.apiAvailable = true;
      
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
      document.getElementById('input-name1').value = '';
      document.getElementById('input-name2').value = '';
      document.getElementById('btn-names-next').disabled = true;
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('wheel-result').textContent = '';
      
      showScreen('screen-names');
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
      showScreen('screen-names');
    });
  </script>
</body>
</html>
