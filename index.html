<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Правда или Наказание · для компании</title>
  <style>
    :root {
      --bg: #0f0a14;
      --bg-light: #1a1122;
      --bg-card: rgba(20, 12, 28, 0.85);
      --primary: #ff4d7d;
      --primary-light: #ff8ba7;
      --primary-dark: #c4456e;
      --accent: #ffd166;
      --purple: #b44dff;
      --text: #fbe9f0;
      --text-soft: #c9b0bd;
      --text-muted: #8a6a7a;
      --border: rgba(255, 77, 125, 0.25);
      --border-strong: rgba(255, 77, 125, 0.6);
      --glow: rgba(255, 77, 125, 0.15);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      --radius: 24px;
      --radius-sm: 16px;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('photo.png') center/cover no-repeat;
      filter: brightness(0.35) saturate(0.6);
      z-index: -3;
    }

    .gradient-overlay {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, 
        #ff6b6b, #ff9a9e, #fecfef, #a8edea, #fddb92, 
        #d4fc79, #96e6a1, #84fab0, #8fd3f4, #a18cd1, 
        #fbc2eb, #f6d365, #fda085, #f6d365, #ff6b6b
      );
      background-size: 600% 600%;
      animation: rainbowGradient 20s ease infinite;
      z-index: -2;
      pointer-events: none;
      opacity: 0.25;
    }

    @keyframes rainbowGradient {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 100%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 0%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 15, 0.65);
      z-index: -1;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px 20px;
      box-shadow: var(--shadow), 0 0 40px var(--glow);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      animation: fadeIn 0.5s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }

    .screen::-webkit-scrollbar { width: 4px; }
    .screen::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 10px; }
    .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-title {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleGradient 8s ease infinite;
    }

    @keyframes titleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-subtitle {
      text-align: center;
      color: var(--text-soft);
      margin-bottom: 20px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.5s;
      transform: translate(-50%, -50%);
    }
    .btn:active::after { width: 300px; height: 300px; }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ff9ff3);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border);
      color: var(--text-soft);
    }
    .btn-secondary:hover {
      border-color: #ff9ff3;
      color: var(--text);
      background: rgba(255, 159, 243, 0.08);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-back {
      display: inline-block;
      width: auto;
      padding: 8px 16px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-bottom: 14px;
      transition: all var(--transition);
    }
    .btn-back:hover { border-color: #ff9ff3; color: var(--text); }

    .mode-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .mode-card {
      flex: 1;
      min-width: 120px;
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .mode-card:hover { border-color: #ff9ff3; background: rgba(255, 159, 243, 0.06); }
    .mode-card.selected {
      border-color: #ff9ff3;
      background: rgba(255, 159, 243, 0.1);
      box-shadow: 0 0 20px rgba(255, 159, 243, 0.15);
    }
    .mode-icon { font-size: 2rem; margin-bottom: 6px; }
    .mode-name { font-weight: 600; font-size: 0.95rem; }

    .player-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .player-input-row input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all var(--transition);
    }
    .player-input-row input:focus { border-color: #ff9ff3; box-shadow: 0 0 15px rgba(255, 159, 243, 0.2); }
    .player-input-row .remove-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .player-input-row .remove-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
    }

    .add-player-btn {
      display: inline-block;
      width: auto;
      padding: 10px 20px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-top: 5px;
      transition: all var(--transition);
    }
    .add-player-btn:hover { border-color: #ff9ff3; color: var(--text); background: rgba(255, 159, 243, 0.06); }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255, 159, 243, 0.1);
      padding: 8px 14px;
      border-radius: 25px;
      border: 1px solid var(--border);
    }
    .turn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff9ff3;
      box-shadow: 0 0 8px #ff9ff3;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .skip-counter {
      font-size: 0.75rem;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 14px;
      margin: 14px 0;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.5;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      word-wrap: break-word;
      transition: all var(--transition);
    }
    .card.pop { animation: cardPop 0.4s ease; }
    @keyframes cardPop {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .card.super-task {
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.1);
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .action-buttons .btn {
      flex: 1;
      min-width: 100px;
      margin-bottom: 0;
      font-size: 0.8rem;
      padding: 12px 14px;
    }

    @media (max-width: 480px) {
      .screen { padding: 18px 14px; max-height: 95vh; }
      .app-title { font-size: 1.4rem; }
      .card { font-size: 1rem; padding: 14px 10px; }
      .btn { padding: 12px 15px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="gradient-overlay"></div>
  <div class="app">
    <div id="screen-players" class="screen active">

      <button class="btn btn-primary" style="margin-top: 16px;" id="btn-players-next" disabled onclick="goToMode()">Продолжить</button>

        </div>
        <div class="mode-card" data-mode="adult" onclick="selectMode('adult')">
          <div class="mode-icon">🔥</div>
          <div class="mode-name">18+</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-mode-next" disabled onclick="goToGame()">Продолжить</button>
    </div>

    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="turn-indicator">
          <span class="turn-dot"></span>

      <div class="action-buttons" id="action-buttons" style="display: none;">

        "Поцелуй {name} в ухо",
        "Проведи пальцами по губам {name}",
        "Сделай {name} комплимент о его/её теле",
        "Поцелуй {name} в живот",
        "Позволь {name} поцеловать тебя куда захочет",
        "Скажи {name}, что он(а) самый(ая) сексуальный(ая)"
      ]
    };

    let gameState = {
      mode: null,
      players: [],
      currentPlayerIndex: 0,
      skipCount: 0,
      maxSkips: 3,
      usedCards: { truth: new Set(), dare: new Set() },
      currentCardType: null
    };

    function saveState() {
      localStorage.setItem('truthOrDareState', JSON.stringify({
        mode: gameState.mode,
        players: gameState.players,
        currentPlayerIndex: gameState.currentPlayerIndex,
        skipCount: gameState.skipCount,
        usedTruth: Array.from(gameState.usedCards.truth),
        usedDare: Array.from(gameState.usedCards.dare)
      }));
    }

    function loadState() {
      const saved = localStorage.getItem('truthOrDareState');
      if (saved) {
        const s = JSON.parse(saved);
        gameState.mode = s.mode;
        gameState.players = s.players || [];
        gameState.currentPlayerIndex = s.currentPlayerIndex || 0;
        gameState.skipCount = s.skipCount || 0;
        gameState.usedCards.truth = new Set(s.usedTruth || []);
        gameState.usedCards.dare = new Set(s.usedDare || []);
        return true;
      }
      return false;
    }

    function addPlayer(name = '') {
      if (gameState.players.length >= 10) return;
      gameState.players.push(name);
      renderPlayers();
      updateNextButton();
    }

    function removePlayer(index) {
      if (gameState.players.length <= 2) return;
      gameState.players.splice(index, 1);
      renderPlayers();
      updateNextButton();
    }

    function renderPlayers() {
      const container = document.getElementById('players-container');
      container.innerHTML = '';
      gameState.players.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
          <input type="text" placeholder="Игрок ${i+1}" value="${p}" maxlength="20" oninput="updatePlayerName(${i}, this.value)">
          ${gameState.players.length > 2 ? `<button class="remove-btn" onclick="removePlayer(${i})">×</button>` : ''}
        `;
        container.appendChild(row);
      });
    }

    function updatePlayerName(i, val) {
      gameState.players[i] = val.trim();
      updateNextButton();
    }

    function updateNextButton() {
      const valid = gameState.players.length >= 2 && gameState.players.every(p => p.trim());
      document.getElementById('btn-players-next').disabled = !valid;
    }

    function goToMode() {
      saveState();
      showScreen('screen-mode');
    }

    function selectMode(mode) {
      gameState.mode = mode;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-mode-next').disabled = false;
    }

    function goToGame() {
      gameState.currentPlayerIndex = Math.floor(Math.random() * gameState.players.length);
      document.getElementById('current-turn-name').textContent = gameState.players[gameState.currentPlayerIndex];
      updateSkipCounter();
      document.getElementById('card-text').textContent = 'Выберите действие';
      document.getElementById('card-text').className = 'card';
      document.getElementById('choice-buttons').style.display = 'flex';
      document.getElementById('action-buttons').style.display = 'none';
      saveState();
      showScreen('screen-game');
    }

    function drawCard(type) {
      const questions = gameState.mode === 'adult' ? adultQuestions : regularQuestions;
      const list = questions[type];
      const other = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
      
      let available = [];
      for (let i = 0; i < list.length; i++) {
        if (!gameState.usedCards[type].has(i)) available.push(i);
      }
      if (available.length === 0) {
        gameState.usedCards[type].clear();
        available = list.map((_, i) => i);
      }
      
      const idx = available[Math.floor(Math.random() * available.length)];
      gameState.usedCards[type].add(idx);
      gameState.currentCardType = type;
      
      const text = list[idx].replace(/{name}/g, other);
      document.getElementById('card-text').textContent = text;
      document.getElementById('card-text').className = 'card pop';
      document.getElementById('choice-buttons').style.display = 'none';
      document.getElementById('action-buttons').style.display = 'flex';
      saveState();
    }

    function skipCard() {
      if (gameState.skipCount >= gameState.maxSkips - 1 && gameState.mode === 'adult' && gameState.currentCardType === 'dare') {
        const other = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
        document.getElementById('card-text').textContent = `🔥 СУПЕР-ЗАДАНИЕ! Сделай ${other} минет или куни!`;
        document.getElementById('card-text').className = 'card super-task';
        gameState.skipCount++;
        updateSkipCounter();
        saveState();
        return;
      }
      if (gameState.skipCount >= gameState.maxSkips) return;
      gameState.skipCount++;
      updateSkipCounter();
      drawCard(gameState.currentCardType);
    }

    function completeCard() {
      gameState.skipCount = 0;
      updateSkipCounter();
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      document.getElementById('current-turn-name').textContent = gameState.players[gameState.currentPlayerIndex];
      document.getElementById('card-text').textContent = 'Выберите действие';
      document.getElementById('card-text').className = 'card';
      document.getElementById('choice-buttons').style.display = 'flex';
      document.getElementById('action-buttons').style.display = 'none';
      saveState();
    }

    function updateSkipCounter() {
      document.getElementById('skip-counter').textContent = `Пропуски: ${gameState.maxSkips - gameState.skipCount}/${gameState.maxSkips}`;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function resetAll() {
      localStorage.removeItem('truthOrDareState');
      gameState = {
        mode: null, players: [], currentPlayerIndex: 0, skipCount: 0, maxSkips: 3,
        usedCards: { truth: new Set(), dare: new Set() }, currentCardType: null
      };
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
      addPlayer();
      addPlayer();
      showScreen('screen-players');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (loadState() && gameState.players.length > 0) {
        renderPlayers();
        updateNextButton();
        showScreen('screen-players');
      } else {
        addPlayer();
        addPlayer();
        showScreen('screen-players');
      }
    });
  </script>
</body>
</html>
