<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Правда или Наказание · для компании</title>
  <style>
    :root {
      --bg: #0f0a14;
      --bg-light: #1a1122;
      --bg-card: rgba(20, 12, 28, 0.85);
      --primary: #ff4d7d;
      --primary-light: #ff8ba7;
      --primary-dark: #c4456e;
      --accent: #ffd166;
      --purple: #b44dff;
      --text: #fbe9f0;
      --text-soft: #c9b0bd;
      --text-muted: #8a6a7a;
      --border: rgba(255, 77, 125, 0.25);
      --border-strong: rgba(255, 77, 125, 0.6);
      --glow: rgba(255, 77, 125, 0.15);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      --radius: 24px;
      --radius-sm: 16px;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    /* Фоновое изображение */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('photo.png') center/cover no-repeat;
      filter: brightness(0.35) saturate(0.6);
      z-index: -3;
    }

    /* Мягкий переливающийся градиент всеми цветами */
    .gradient-overlay {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, 
        #ff6b6b, #ff9a9e, #fecfef, #a8edea, #fddb92, 
        #d4fc79, #96e6a1, #84fab0, #8fd3f4, #a18cd1, 
        #fbc2eb, #f6d365, #fda085, #f6d365, #ff6b6b
      );
      background-size: 600% 600%;
      animation: rainbowGradient 20s ease infinite;
      z-index: -2;
      pointer-events: none;
      opacity: 0.25;
    }

    @keyframes rainbowGradient {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 100%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 0%; }
      100% { background-position: 0% 50%; }
    }

    /* Затемнение для читаемости */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 15, 0.65);
      z-index: -1;
      pointer-events: none;
    }

    /* Свечение по краям */
    .app::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 0% 30%, rgba(255, 107, 107, 0.1) 0%, transparent 40%),
        radial-gradient(ellipse at 100% 70%, rgba(164, 120, 255, 0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 209, 102, 0.05) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
      animation: glowPulse 6s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px 20px;
      box-shadow: var(--shadow), 0 0 40px var(--glow);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      animation: fadeIn 0.5s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }

    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }
    .screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-title {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleGradient 8s ease infinite;
    }

    @keyframes titleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-subtitle {
      text-align: center;
      color: var(--text-soft);
      margin-bottom: 20px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.5s;
      transform: translate(-50%, -50%);
    }
    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ff9ff3);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border);
      color: var(--text-soft);
      box-shadow: none;
    }
    .btn-secondary:hover {
      border-color: #ff9ff3;
      color: var(--text);
      background: rgba(255, 159, 243, 0.08);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-back {
      display: inline-block;
      width: auto;
      padding: 8px 16px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-bottom: 14px;
      transition: all var(--transition);
    }
    .btn-back:hover {
      border-color: #ff9ff3;
      color: var(--text);
    }

    /* Режимы */
    .mode-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .mode-card {
      flex: 1;
      min-width: 120px;
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .mode-card:hover {
      border-color: #ff9ff3;
      background: rgba(255, 159, 243, 0.06);
    }
    .mode-card.selected {
      border-color: #ff9ff3;
      background: rgba(255, 159, 243, 0.1);
      box-shadow: 0 0 20px rgba(255, 159, 243, 0.15);
    }
    .mode-icon {
      font-size: 2rem;
      margin-bottom: 6px;
    }
    .mode-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Игроки */
    .player-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .player-input-row input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all var(--transition);
    }
    .player-input-row input:focus {
      border-color: #ff9ff3;
      box-shadow: 0 0 15px rgba(255, 159, 243, 0.2);
    }
    .player-input-row .remove-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .player-input-row .remove-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
    }

    .add-player-btn {
      display: inline-block;
      width: auto;
      padding: 10px 20px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-top: 5px;
      transition: all var(--transition);
    }
    .add-player-btn:hover {
      border-color: #ff9ff3;
      color: var(--text);
      background: rgba(255, 159, 243, 0.06);
    }

    /* Барабан */
    .wheel-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 15px auto;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 0 40px rgba(255, 159, 243, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }
    .wheel-segment {
      position: absolute;
      width: 50%;
      height: 50%;
      left: 50%;
      top: 50%;
      transform-origin: 0% 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wheel-segment span {
      position: absolute;
      font-size: 0.65rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      transform-origin: center;
    }
    .wheel-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .wheel-result {
      text-align: center;
      margin-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      min-height: 28px;
    }

    /* Игровой экран */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255, 159, 243, 0.1);
      padding: 8px 14px;
      border-radius: 25px;
      border: 1px solid var(--border);
    }
    .turn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff9ff3;
      box-shadow: 0 0 8px #ff9ff3;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .skip-counter {
      font-size: 0.75rem;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 14px;
      margin: 14px 0;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.5;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      word-wrap: break-word;
      transition: all var(--transition);
    }
    .card.pop {
      animation: cardPop 0.4s ease;
    }
    @keyframes cardPop {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .card.super-task {
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.1);
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .action-buttons .btn {
      flex: 1;
      min-width: 100px;
      margin-bottom: 0;
      font-size: 0.8rem;
      padding: 12px 14px;
    }

    @media (max-width: 480px) {
      .screen {
        padding: 18px 14px;
        max-height: 95vh;
      }
      .app-title {
        font-size: 1.4rem;
      }
      .card {
        font-size: 1rem;
        padding: 14px 10px;
      }
      .wheel-container {
        width: 170px;
        height: 170px;
      }
      .btn {
        padding: 12px 15px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="gradient-overlay"></div>
  <div class="app">
    <!-- ЭКРАН 1: ИГРОКИ -->
    <div id="screen-players" class="screen active">
      <h1 class="app-title">✨ Правда или Наказание</h1>
      <p class="app-subtitle">Добавьте игроков (от 2 до 10)</p>
      <div id="players-container"></div>
      <button class="add-player-btn" id="add-player-btn" onclick="addPlayer()">+ Добавить игрока</button>
      <button class="btn btn-primary" style="margin-top: 16px;" id="btn-players-next" disabled onclick="goToMode()">Продолжить</button>
    </div>

    <!-- ЭКРАН 2: РЕЖИМ -->
    <div id="screen-mode" class="screen">
      <button class="btn-back" onclick="showScreen('screen-players')">← Назад</button>
      <h1 class="app-title">Выберите режим</h1>
      <p class="app-subtitle">Как будете играть?</p>
      <div class="mode-grid">
        <div class="mode-card" data-mode="regular" onclick="selectMode('regular')">
          <div class="mode-icon">💖</div>
          <div class="mode-name">Обычная</div>
        </div>
        <div class="mode-card" data-mode="adult" onclick="selectMode('adult')">
          <div class="mode-icon">🔥</div>
          <div class="mode-name">18+</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-mode-next" disabled onclick="goToTurnWheel()">Продолжить</button>
    </div>

    <!-- ЭКРАН 3: БАРАБАН -->
    <div id="screen-wheel" class="screen">
      <h1 class="app-title" id="wheel-title">Барабан</h1>
      <p class="app-subtitle" id="wheel-subtitle">Крутите!</p>
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <div class="wheel" id="wheel"></div>
      </div>
      <button class="btn btn-primary" id="btn-spin" onclick="spinWheel()">Крутить</button>
      <p class="wheel-result" id="wheel-result"></p>
      <button class="btn btn-primary" id="btn-wheel-continue" style="display: none;" onclick="continueAfterWheel()">Продолжить →</button>
    </div>

    <!-- ЭКРАН 4: ИГРА -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="turn-indicator">
          <span class="turn-dot"></span>
          <span id="current-turn-name">—</span>
        </div>
        <span class="skip-counter" id="skip-counter">Пропуски: 3/3</span>
      </div>
      <div class="card" id="card-text">Крутите барабан</div>
      <button class="btn btn-primary" id="btn-spin-action" onclick="spinActionWheel()">🎡 Крутить барабан</button>
      <div class="action-buttons" id="action-buttons" style="display: none;">
        <button class="btn btn-secondary" onclick="skipCard()">Пропустить</button>
        <button class="btn btn-primary" onclick="completeCard()">Выполнил(а) ✓</button>
      </div>
      <button class="btn btn-secondary" style="margin-top: 8px;" onclick="resetAll()">🔄 Начать заново</button>
    </div>
  </div>

  <script>
    // ====== ДАННЫЕ ======
    const generationData = {
      regular: {
        truth: [
          "Что ты чувствуешь, когда {name} смотрит на тебя?",
          "Что для тебя значит {name}?",
          "О чём ты думаешь, когда {name} рядом?",
          "Что бы ты сделал(а) для {name}?",
          "Как {name} меняет твою жизнь?",
          "Что тебя привлекает в {name}?",
          "Какой момент с {name} ты ценишь больше всего?",
          "Что ты хочешь сказать {name}?",
          "Какой комплимент ты мечтаешь услышать от {name}?",
          "Что для тебя идеальный день с {name}?"
        ],
        dare: [
          "Обними {name}",
          "Поцелуй {name} в лоб",
          "Скажи {name} комплимент",
          "Сделай {name} массаж",
          "Прошепчи {name} что-то нежное",
          "Потанцуй с {name}",
          "Подари {name} улыбку",
          "Обними {name} сзади",
          "Погладь {name} по голове",
          "Скажи {name}, что он(а) особенный(ая)"
        ]
      },
      adult: {
        truth: [
          "Что тебя возбуждает в {name}?",
          "Какая твоя фантазия с {name}?",
          "Где бы ты хотел(а) {name}?",
          "Что бы ты сделал(а) с {name}?",
          "Какой момент с {name} ты хочешь повторить?",
          "Что тебе нравится в {name}?",
          "Как {name} должен(на) соблазнять тебя?",
          "Что ты хочешь от {name}?",
          "Какая поза с {name} тебе нравится?",
          "Что для тебя идеальная ночь с {name}?"
        ],
        dare: [
          "Поцелуй {name} в шею",
          "Сними одежду с {name}",
          "Прошепчи {name} грязную фразу",
          "Сделай {name} эротический массаж",
          "Сядь на колени к {name}",
          "Прикоснись к {name}",
          "Поцелуй {name} страстно",
          "Соблазни {name}",
          "Укуси {name}",
          "Позволь {name} раздеть тебя"
        ]
      }
    };

    // ====== СОСТОЯНИЕ ======
    let gameState = {
      mode: null,
      players: [],
      currentPlayerIndex: 0,
      skipCount: 0,
      maxSkips: 3,
      usedCards: { truth: new Set(), dare: new Set() },
      currentCardType: null,
      wheelPurpose: null // 'turn' или 'action'
    };

    // ====== СОХРАНЕНИЕ ======
    function saveState() {
      const state = {
        mode: gameState.mode,
        players: gameState.players,
        currentPlayerIndex: gameState.currentPlayerIndex,
        skipCount: gameState.skipCount,
        usedTruth: Array.from(gameState.usedCards.truth),
        usedDare: Array.from(gameState.usedCards.dare)
      };
      localStorage.setItem('truthOrDareState', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('truthOrDareState');
      if (saved) {
        const state = JSON.parse(saved);
        gameState.mode = state.mode;
        gameState.players = state.players || [];
        gameState.currentPlayerIndex = state.currentPlayerIndex || 0;
        gameState.skipCount = state.skipCount || 0;
        gameState.usedCards.truth = new Set(state.usedTruth || []);
        gameState.usedCards.dare = new Set(state.usedDare || []);
        return true;
      }
      return false;
    }

    function clearSavedState() {
      localStorage.removeItem('truthOrDareState');
    }

    // ====== ИГРОКИ ======
    function addPlayer(name = '') {
      if (gameState.players.length >= 10) {
        alert('Максимум 10 игроков!');
        return;
      }
      gameState.players.push(name);
      renderPlayers();
      updateNextButton();
    }

    function removePlayer(index) {
      if (gameState.players.length <= 2) {
        alert('Минимум 2 игрока!');
        return;
      }
      gameState.players.splice(index, 1);
      renderPlayers();
      updateNextButton();
    }

    function renderPlayers() {
      const container = document.getElementById('players-container');
      container.innerHTML = '';
      gameState.players.forEach((player, index) => {
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
          <input type="text" placeholder="Игрок ${index + 1}" value="${player}" 
                 maxlength="20" oninput="updatePlayerName(${index}, this.value)">
          ${gameState.players.length > 2 ? 
            `<button class="remove-btn" onclick="removePlayer(${index})">×</button>` : ''}
        `;
        container.appendChild(row);
      });
    }

    function updatePlayerName(index, value) {
      gameState.players[index] = value.trim();
      updateNextButton();
    }

    function updateNextButton() {
      const valid = gameState.players.length >= 2 && 
                    gameState.players.every(p => p.trim() !== '');
      document.getElementById('btn-players-next').disabled = !valid;
    }

    function goToMode() {
      if (gameState.players.length < 2) return;
      saveState();
      showScreen('screen-mode');
    }

    // ====== РЕЖИМ ======
    function selectMode(mode) {
      gameState.mode = mode;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-mode-next').disabled = false;
    }

    function goToTurnWheel() {
      if (!gameState.mode) return;
      gameState.wheelPurpose = 'turn';
      buildWheel(gameState.players, 'turn');
      
      document.getElementById('wheel-title').textContent = 'Кто ходит?';
      document.getElementById('wheel-subtitle').textContent = 'Крутите барабан';
      document.getElementById('wheel-result').textContent = '';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      
      saveState();
      showScreen('screen-wheel');
    }

    function spinActionWheel() {
      gameState.wheelPurpose = 'action';
      buildWheel(['Правда', 'Наказание'], 'action');
      
      document.getElementById('wheel-title').textContent = 'Что делать?';
      document.getElementById('wheel-subtitle').textContent = 'Крутите барабан';
      document.getElementById('wheel-result').textContent = '';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      
      document.getElementById('card-text').textContent = 'Крутите барабан...';
      document.getElementById('card-text').className = 'card';
      document.getElementById('action-buttons').style.display = 'none';
      
      showScreen('screen-wheel');
    }

    // ====== БАРАБАН ======
    function buildWheel(items, purpose) {
      const wheel = document.getElementById('wheel');
      wheel.innerHTML = '';
      
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0', '#ff9f43', '#00d2d3'];
      const n = items.length;
      const angle = 360 / n;
      
      items.forEach((item, i) => {
        const seg = document.createElement('div');
        seg.className = 'wheel-segment';
        const rotation = i * angle;
        
        seg.style.cssText = `
          transform: rotate(${rotation}deg);
          background: ${colors[i % colors.length]};
          clip-path: polygon(0% 0%, 100% 0%, 0% 100%);
        `;
        
        const label = document.createElement('span');
        label.textContent = purpose === 'turn' ? item : (i === 0 ? '💖 Правда' : '🔥 Наказание');
        label.style.cssText = `
          transform: rotate(${angle / 2}deg);
          top: 20%;
          left: 15%;
          font-size: 0.7rem;
        `;
        
        seg.appendChild(label);
        wheel.appendChild(seg);
      });
      
      // Центральный круг
      const center = document.createElement('div');
      center.style.cssText = `
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.5);
        z-index: 1;
      `;
      wheel.appendChild(center);
    }

    let wheelSpinning = false;

    function spinWheel() {
      if (wheelSpinning) return;
      wheelSpinning = true;
      
      const wheel = document.getElementById('wheel');
      const resultEl = document.getElementById('wheel-result');
      const btnSpin = document.getElementById('btn-spin');
      const btnContinue = document.getElementById('btn-wheel-continue');
      
      btnSpin.disabled = true;
      resultEl.textContent = '...';
      
      const spins = 5 + Math.floor(Math.random() * 4);
      const n = gameState.wheelPurpose === 'turn' ? gameState.players.length : 2;
      const angle = 360 / n;
      const randomIndex = Math.floor(Math.random() * n);
      const target = randomIndex * angle + angle / 2;
      const totalRotation = spins * 360 + target;
      
      wheel.style.transform = `rotate(${totalRotation}deg)`;
      
      setTimeout(() => {
        const finalAngle = totalRotation % 360;
        const winner = Math.floor(finalAngle / angle) % n;
        
        if (gameState.wheelPurpose === 'turn') {
          gameState.currentPlayerIndex = winner;
          resultEl.textContent = `🎉 ${gameState.players[winner]}!`;
        } else {
          gameState.currentCardType = winner === 0 ? 'truth' : 'dare';
          resultEl.textContent = winner === 0 ? '💖 Правда!' : '🔥 Наказание!';
        }
        
        btnSpin.style.display = 'none';
        btnContinue.style.display = 'block';
        wheelSpinning = false;
        saveState();
      }, 3000);
    }

    function continueAfterWheel() {
      if (gameState.wheelPurpose === 'turn') {
        document.getElementById('current-turn-name').textContent = 
          gameState.players[gameState.currentPlayerIndex];
        updateSkipCounter();
        document.getElementById('card-text').textContent = 'Крутите барабан';
        document.getElementById('card-text').className = 'card';
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('btn-spin-action').style.display = 'block';
        showScreen('screen-game');
      } else {
        const cardText = generateCard(gameState.currentCardType);
        document.getElementById('card-text').textContent = cardText;
        document.getElementById('card-text').className = 'card pop';
        document.getElementById('action-buttons').style.display = 'flex';
        document.getElementById('btn-spin-action').style.display = 'none';
        showScreen('screen-game');
      }
    }

    // ====== ГЕНЕРАЦИЯ ======
    function generateCard(type) {
      const questions = generationData[gameState.mode][type];
      const otherPlayer = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
      
      let available = [];
      for (let i = 0; i < questions.length; i++) {
        if (!gameState.usedCards[type].has(i)) available.push(i);
      }
      if (available.length === 0) {
        gameState.usedCards[type].clear();
        available = questions.map((_, i) => i);
      }
      
      const randomIndex = available[Math.floor(Math.random() * available.length)];
      gameState.usedCards[type].add(randomIndex);
      
      return questions[randomIndex].replace(/{name}/g, otherPlayer);
    }

    // ====== ИГРА ======
    function skipCard() {
      if (gameState.skipCount >= gameState.maxSkips - 1) {
        if (gameState.mode === 'adult' && gameState.currentCardType === 'dare') {
          const otherPlayer = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
          const cardEl = document.getElementById('card-text');
          cardEl.textContent = `🔥 СУПЕР-ЗАДАНИЕ! Сделай ${otherPlayer} минет или куни!`;
          cardEl.className = 'card super-task';
          gameState.skipCount++;
          updateSkipCounter();
          saveState();
          return;
        }
      }
      
      if (gameState.skipCount >= gameState.maxSkips) return;
      
      gameState.skipCount++;
      updateSkipCounter();
      
      const cardText = generateCard(gameState.currentCardType);
      const cardEl = document.getElementById('card-text');
      cardEl.textContent = cardText;
      cardEl.className = 'card pop';
    }

    function completeCard() {
      gameState.skipCount = 0;
      updateSkipCounter();
      
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      document.getElementById('current-turn-name').textContent = 
        gameState.players[gameState.currentPlayerIndex];
      
      document.getElementById('card-text').textContent = 'Крутите барабан';
      document.getElementById('card-text').className = 'card';
      document.getElementById('action-buttons').style.display = 'none';
      document.getElementById('btn-spin-action').style.display = 'block';
      
      saveState();
    }

    function updateSkipCounter() {
      const remaining = gameState.maxSkips - gameState.skipCount;
      document.getElementById('skip-counter').textContent = `Пропуски: ${remaining}/${gameState.maxSkips}`;
    }

    // ====== ЭКРАНЫ ======
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function resetAll() {
      gameState.mode = null;
      gameState.players = [];
      gameState.currentPlayerIndex = 0;
      gameState.skipCount = 0;
      gameState.usedCards = { truth: new Set(), dare: new Set() };
      gameState.currentCardType = null;
      gameState.wheelPurpose = null;
      
      clearSavedState();
      
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
      
      gameState.players = [];
      addPlayer();
      addPlayer();
      
      showScreen('screen-players');
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
      if (loadState() && gameState.players && gameState.players.length > 0) {
        renderPlayers();
        updateNextButton();
        showScreen('screen-players');
      } else {
        gameState.players = [];
        addPlayer();
        addPlayer();
        showScreen('screen-players');
      }
    });
  </script>
</body>
</html>
