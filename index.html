<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Правда или Наказание · для двоих</title>
  <style>
    :root {
      --bg: #0f0a14;
      --bg-light: #1a1122;
      --bg-card: rgba(20, 12, 28, 0.92);
      --primary: #ff4d7d;
      --primary-light: #ff8ba7;
      --primary-dark: #c4456e;
      --accent: #ffd166;
      --text: #fbe9f0;
      --text-soft: #c9b0bd;
      --text-muted: #8a6a7a;
      --border: rgba(255, 77, 125, 0.3);
      --border-strong: rgba(255, 77, 125, 0.6);
      --glow: rgba(255, 77, 125, 0.25);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      --radius: 20px;
      --radius-sm: 14px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* Фоновое изображение */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('photo.png') center/cover no-repeat;
      filter: brightness(0.3) saturate(0.7) blur(2px);
      z-index: -2;
    }

    /* Затемнение поверх фото */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, rgba(15, 10, 20, 0.75) 0%, rgba(26, 17, 34, 0.85) 50%, rgba(15, 10, 20, 0.75) 100%);
      z-index: -1;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 25px;
      box-shadow: var(--shadow), 0 0 60px var(--glow);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      animation: fadeIn 0.4s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }

    .screen::-webkit-scrollbar {
      width: 5px;
    }

    .screen::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    .screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-title {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff8ba7, #ff4d7d, #c4456e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-subtitle {
      text-align: center;
      color: var(--text-soft);
      margin-bottom: 24px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.5s;
      transform: translate(-50%, -50%);
    }

    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d7d, #c4456e);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 77, 125, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 77, 125, 0.55);
      background: linear-gradient(135deg, #ff5e8a, #d4557e);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text-soft);
      box-shadow: none;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--text);
      background: rgba(255, 77, 125, 0.05);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-back {
      display: inline-block;
      width: auto;
      padding: 8px 16px;
      font-size: 0.85rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      transition: all var(--transition);
      border-radius: 30px;
      margin-bottom: 16px;
    }

    .btn-back:hover {
      border-color: var(--primary);
      color: var(--text);
      background: rgba(255, 77, 125, 0.05);
    }

    .mode-grid {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .mode-card {
      flex: 1;
      min-width: 130px;
      padding: 18px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
    }

    .mode-card:hover {
      border-color: var(--primary);
      background: rgba(255, 77, 125, 0.06);
    }

    .mode-card.selected {
      border-color: var(--primary);
      background: rgba(255, 77, 125, 0.1);
      box-shadow: 0 0 20px rgba(255, 77, 125, 0.2);
    }

    .mode-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .mode-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .mode-desc {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-top: 3px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text-soft);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: all var(--transition);
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 77, 125, 0.2);
      background: rgba(255, 77, 125, 0.05);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    /* Барабан */
    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 20px auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        var(--primary) 0deg 180deg,
        #ff8ba7 180deg 360deg
      );
      position: relative;
      transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 0 40px rgba(255, 77, 125, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.2);
      border: 4px solid rgba(255, 255, 255, 0.2);
    }

    .wheel-half {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      padding: 15px;
      text-align: center;
    }

    .wheel-half.left {
      left: 0;
      border-radius: 50% 0 0 50%;
    }

    .wheel-half.right {
      right: 0;
      border-radius: 0 50% 50% 0;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
      z-index: 2;
    }

    .wheel-result {
      text-align: center;
      margin-top: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      min-height: 30px;
    }

    /* Игровой экран */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 1rem;
      background: rgba(255, 77, 125, 0.12);
      padding: 8px 14px;
      border-radius: 25px;
      border: 1px solid var(--border);
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .skip-counter {
      font-size: 0.8rem;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      margin: 16px 0;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 500;
      line-height: 1.6;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      word-wrap: break-word;
      transition: all var(--transition);
    }

    .card.pop {
      animation: cardPop 0.4s ease;
    }

    @keyframes cardPop {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }

    .card.super-task {
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.1);
      box-shadow: 0 0 25px rgba(255, 209, 102, 0.25);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .action-buttons .btn {
      flex: 1;
      min-width: 120px;
      margin-bottom: 0;
      font-size: 0.85rem;
      padding: 13px 15px;
    }

    @media (max-width: 480px) {
      .screen {
        padding: 20px 15px;
        max-height: 95vh;
      }
      .app-title {
        font-size: 1.6rem;
      }
      .card {
        font-size: 1.05rem;
        padding: 16px 12px;
      }
      .wheel-container {
        width: 180px;
        height: 180px;
      }
      .wheel-half {
        font-size: 0.9rem;
        padding: 10px;
      }
      .mode-card {
        min-width: 100px;
        padding: 14px 8px;
      }
      .btn {
        padding: 13px 15px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ЭКРАН 1: ВВОД ИМЁН -->
    <div id="screen-names" class="screen active">
      <h1 class="app-title">Правда или Наказание</h1>
      <p class="app-subtitle">Представьтесь, пожалуйста</p>
      <div class="input-group">
        <label class="input-label">Имя первого игрока</label>
        <input type="text" id="input-name1" class="input-field" placeholder="Введите имя" maxlength="20" oninput="checkNames()">
      </div>
      <div class="input-group">
        <label class="input-label">Имя второго игрока</label>
        <input type="text" id="input-name2" class="input-field" placeholder="Введите имя" maxlength="20" oninput="checkNames()">
      </div>
      <button class="btn btn-primary" id="btn-names-next" disabled onclick="goToMode()">Продолжить</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР РЕЖИМА -->
    <div id="screen-mode" class="screen">
      <button class="btn-back" onclick="goBackToNames()">← Назад</button>
      <h1 class="app-title">Выберите режим</h1>
      <p class="app-subtitle">Как будете играть?</p>
      <div class="mode-grid">
        <div class="mode-card" data-mode="regular" onclick="selectMode('regular')">
          <div class="mode-icon">💖</div>
          <div class="mode-name">Обычная</div>
          <div class="mode-desc">Нежные вопросы</div>
        </div>
        <div class="mode-card" data-mode="adult" onclick="selectMode('adult')">
          <div class="mode-icon">🔥</div>
          <div class="mode-name">18+</div>
          <div class="mode-desc">С огоньком</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-mode-next" disabled onclick="goToWheel()">Продолжить</button>
    </div>

    <!-- ЭКРАН 3: БАРАБАН (кто ходит + что делать) -->
    <div id="screen-wheel" class="screen">
      <h1 class="app-title" id="wheel-title">Кто начнёт?</h1>
      <p class="app-subtitle" id="wheel-subtitle">Крутите барабан</p>
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <div class="wheel" id="wheel">
          <div class="wheel-half left" id="wheel-half1">Игрок 1</div>
          <div class="wheel-half right" id="wheel-half2">Игрок 2</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-spin" onclick="spinWheel()">Крутить</button>
      <p class="wheel-result" id="wheel-result"></p>
      <button class="btn btn-primary" id="btn-wheel-continue" style="display: none;" onclick="goToGame()">Перейти к игре →</button>
    </div>

    <!-- ЭКРАН 4: ИГРА -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="turn-indicator">
          <span class="turn-dot"></span>
          <span id="current-turn-name">—</span>
        </div>
        <span class="skip-counter" id="skip-counter">Пропуски: 3/3</span>
      </div>
      <div class="card" id="card-text">Нажмите «Крутить барабан»</div>
      <button class="btn btn-primary" id="btn-spin-action" onclick="spinActionWheel()">🎡 Крутить барабан</button>
      <div class="action-buttons" id="action-buttons" style="display: none;">
        <button class="btn btn-secondary" id="btn-skip" onclick="skipCard()">Пропустить</button>
        <button class="btn btn-primary" id="btn-complete" onclick="completeCard()">Выполнил(а) ✓</button>
      </div>
      <button class="btn btn-secondary" style="margin-top: 10px;" onclick="resetAll()">🔄 Начать заново</button>
    </div>
  </div>

  <script>
    // ====== ДАННЫЕ ДЛЯ ГЕНЕРАЦИИ ======
    const generationData = {
      regular: {
        truth: [
          "Что ты чувствуешь, когда {name} смотрит тебе в глаза?",
          "Что для тебя значит, когда {name} улыбается?",
          "О чём ты думаешь, когда {name} обнимает тебя?",
          "Что бы ты сделал(а), если бы {name} был(а) рядом?",
          "Как ты понимаешь, что {name} тебя любит?",
          "Что тебя больше всего привлекает в {name}?",
          "Какой момент с {name} для тебя самый ценный?",
          "Что ты хочешь сказать {name} прямо сейчас?",
          "Как {name} меняет твою жизнь к лучшему?",
          "Что для тебя идеальный день с {name}?"
        ],
        dare: [
          "Обними {name} крепко и не отпускай 10 секунд",
          "Поцелуй {name} в лоб",
          "Скажи {name} три комплимента",
          "Погладь {name} по щеке",
          "Сделай {name} массаж плеч",
          "Прошепчи {name} на ухо что-то нежное",
          "Потанцуй с {name} без музыки",
          "Подари {name} самый тёплый взгляд",
          "Напиши на спине {name} слово «люблю»",
          "Обними {name} сзади"
        ]
      },
      adult: {
        truth: [
          "Что тебя больше всего возбуждает в {name}?",
          "Какая твоя самая смелая фантазия с {name}?",
          "Где бы ты хотел(а) заняться сексом с {name}?",
          "Что бы ты сделал(а) с {name} прямо сейчас?",
          "Какой интимный момент с {name} ты хочешь повторить?",
          "Что тебе нравится: когда {name} доминирует или подчиняется?",
          "Какая часть тела {name} сводит тебя с ума?",
          "Что ты хочешь, чтобы {name} сделал(а) с тобой?",
          "Как {name} должен(на) соблазнять тебя?",
          "Что для тебя идеальная прелюдия с {name}?"
        ],
        dare: [
          "Поцелуй {name} в шею",
          "Сними одну деталь одежды с {name}",
          "Прошепчи {name} грязную фразу",
          "Сделай {name} эротический массаж",
          "Сядь на колени к {name}",
          "Прикоснись к чувствительной зоне {name}",
          "Поцелуй {name} страстно",
          "Соблазни {name} взглядом",
          "Укуси {name} в плечо",
          "Позволь {name} снять с тебя одну вещь"
        ]
      }
    };

    // ====== СОСТОЯНИЕ ======
    let gameState = {
      mode: null,
      name1: '',
      name2: '',
      currentTurn: 1,
      skipCount: 0,
      maxSkips: 3,
      usedCards: {
        truth: new Set(),
        dare: new Set()
      },
      currentCardType: null,
      currentCardText: '',
      wheelPurpose: 'turn', // 'turn' или 'action'
      isFirstWheel: true
    };

    // ====== СОХРАНЕНИЕ ======
    function saveState() {
      const stateToSave = {
        mode: gameState.mode,
        name1: gameState.name1,
        name2: gameState.name2,
        currentTurn: gameState.currentTurn,
        skipCount: gameState.skipCount,
        usedTruth: Array.from(gameState.usedCards.truth),
        usedDare: Array.from(gameState.usedCards.dare),
        isFirstWheel: gameState.isFirstWheel
      };
      localStorage.setItem('truthOrDareState', JSON.stringify(stateToSave));
    }

    function loadState() {
      const saved = localStorage.getItem('truthOrDareState');
      if (saved) {
        const state = JSON.parse(saved);
        gameState.mode = state.mode;
        gameState.name1 = state.name1;
        gameState.name2 = state.name2;
        gameState.currentTurn = state.currentTurn;
        gameState.skipCount = state.skipCount;
        gameState.usedCards.truth = new Set(state.usedTruth);
        gameState.usedCards.dare = new Set(state.usedDare);
        gameState.isFirstWheel = state.isFirstWheel;
        return true;
      }
      return false;
    }

    function clearSavedState() {
      localStorage.removeItem('truthOrDareState');
    }

    // ====== ГЕНЕРАЦИЯ ======
    function generateCard(type) {
      const questions = generationData[gameState.mode][type];
      const otherName = gameState.currentTurn === 1 ? gameState.name2 : gameState.name1;
      
      let available = [];
      for (let i = 0; i < questions.length; i++) {
        if (!gameState.usedCards[type].has(i)) {
          available.push(i);
        }
      }
      
      if (available.length === 0) {
        gameState.usedCards[type].clear();
        available = questions.map((_, i) => i);
      }
      
      const randomIndex = available[Math.floor(Math.random() * available.length)];
      gameState.usedCards[type].add(randomIndex);
      
      const text = questions[randomIndex].replace(/{name}/g, otherName);
      gameState.currentCardType = type;
      gameState.currentCardText = text;
      
      saveState();
      return text;
    }

    // ====== ЭКРАНЫ ======
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // ====== ИМЕНА ======
    function checkNames() {
      const n1 = document.getElementById('input-name1').value.trim();
      const n2 = document.getElementById('input-name2').value.trim();
      document.getElementById('btn-names-next').disabled = !(n1 && n2);
      if (n1 && n2) {
        gameState.name1 = n1;
        gameState.name2 = n2;
      }
    }

    function goToMode() {
      const n1 = document.getElementById('input-name1').value.trim();
      const n2 = document.getElementById('input-name2').value.trim();
      if (!n1 || !n2) return;
      gameState.name1 = n1;
      gameState.name2 = n2;
      saveState();
      showScreen('screen-mode');
    }

    function goBackToNames() {
      showScreen('screen-names');
      document.getElementById('input-name1').value = gameState.name1 || '';
      document.getElementById('input-name2').value = gameState.name2 || '';
    }

    // ====== РЕЖИМ ======
    function selectMode(mode) {
      gameState.mode = mode;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-mode-next').disabled = false;
      saveState();
    }

    function goToWheel() {
      if (!gameState.mode) return;
      
      gameState.isFirstWheel = true;
      gameState.wheelPurpose = 'turn';
      
      document.getElementById('wheel-title').textContent = 'Кто начнёт?';
      document.getElementById('wheel-subtitle').textContent = 'Крутите барабан';
      document.getElementById('wheel-half1').textContent = gameState.name1;
      document.getElementById('wheel-half2').textContent = gameState.name2;
      document.getElementById('wheel-result').textContent = '';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      
      saveState();
      showScreen('screen-wheel');
    }

    function goBackToMode() {
      showScreen('screen-mode');
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
    }

    // ====== БАРАБАН ======
    let wheelSpinning = false;

    function spinWheel() {
      if (wheelSpinning) return;
      wheelSpinning = true;
      
      const wheel = document.getElementById('wheel');
      const resultEl = document.getElementById('wheel-result');
      const btnSpin = document.getElementById('btn-spin');
      const btnContinue = document.getElementById('btn-wheel-continue');
      
      btnSpin.disabled = true;
      resultEl.textContent = '...';
      
      const spins = 5 + Math.floor(Math.random() * 4);
      const extraAngle = Math.random() * 360;
      const totalRotation = spins * 360 + extraAngle;
      
      wheel.style.transform = `rotate(${totalRotation}deg)`;
      
      setTimeout(() => {
        const finalAngle = totalRotation % 360;
        
        if (gameState.wheelPurpose === 'turn') {
          const winner = finalAngle < 180 ? 1 : 2;
          gameState.currentTurn = winner;
          
          resultEl.textContent = `🎉 Начинает ${winner === 1 ? gameState.name1 : gameState.name2}!`;
        } else {
          const action = finalAngle < 180 ? 'truth' : 'dare';
          gameState.currentCardType = action;
          
          const actionName = action === 'truth' ? 'Правда' : 'Наказание';
          resultEl.textContent = `🎲 Выпало: ${actionName}!`;
        }
        
        btnSpin.style.display = 'none';
        btnContinue.style.display = 'block';
        wheelSpinning = false;
        saveState();
      }, 3000);
    }

    function spinActionWheel() {
      gameState.wheelPurpose = 'action';
      gameState.isFirstWheel = false;
      
      document.getElementById('wheel-half1').textContent = 'Правда';
      document.getElementById('wheel-half2').textContent = 'Наказание';
      document.getElementById('wheel-result').textContent = '';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      document.getElementById('wheel-title').textContent = 'Что выполнять?';
      document.getElementById('wheel-subtitle').textContent = 'Крутите барабан';
      
      document.getElementById('card-text').textContent = 'Крутите барабан...';
      document.getElementById('action-buttons').style.display = 'none';
      
      saveState();
      showScreen('screen-wheel');
    }

    function goToGame() {
      if (gameState.wheelPurpose === 'turn') {
        // После выбора игрока, показываем игровой экран
        document.getElementById('current-turn-name').textContent = 
          gameState.currentTurn === 1 ? gameState.name1 : gameState.name2;
        updateSkipCounter();
        document.getElementById('card-text').textContent = 'Нажмите «Крутить барабан»';
        document.getElementById('card-text').className = 'card';
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('btn-spin-action').style.display = 'block';
        showScreen('screen-game');
      } else {
        // После выбора действия, генерируем карточку
        const cardText = generateCard(gameState.currentCardType);
        document.getElementById('card-text').textContent = cardText;
        document.getElementById('card-text').className = 'card pop';
        document.getElementById('action-buttons').style.display = 'flex';
        document.getElementById('btn-spin-action').style.display = 'none';
        showScreen('screen-game');
      }
    }

    // ====== ИГРА ======
    function skipCard() {
      if (gameState.skipCount >= gameState.maxSkips - 1) {
        if (gameState.mode === 'adult' && gameState.currentCardType === 'dare') {
          const otherName = gameState.currentTurn === 1 ? gameState.name2 : gameState.name1;
          const cardEl = document.getElementById('card-text');
          cardEl.textContent = `🔥 СУПЕР-ЗАДАНИЕ! Сделай ${otherName} минет или куни!`;
          cardEl.className = 'card super-task';
          
          gameState.skipCount++;
          updateSkipCounter();
          document.getElementById('btn-skip').disabled = true;
          saveState();
          return;
        }
      }
      
      if (gameState.skipCount >= gameState.maxSkips) {
        return;
      }
      
      gameState.skipCount++;
      updateSkipCounter();
      
      const cardText = generateCard(gameState.currentCardType);
      const cardEl = document.getElementById('card-text');
      cardEl.textContent = cardText;
      cardEl.className = 'card pop';
    }

    function completeCard() {
      gameState.skipCount = 0;
      updateSkipCounter();
      document.getElementById('btn-skip').disabled = false;
      
      gameState.currentTurn = gameState.currentTurn === 1 ? 2 : 1;
      document.getElementById('current-turn-name').textContent = 
        gameState.currentTurn === 1 ? gameState.name1 : gameState.name2;
      
      document.getElementById('card-text').textContent = 'Нажмите «Крутить барабан»';
      document.getElementById('card-text').className = 'card';
      document.getElementById('action-buttons').style.display = 'none';
      document.getElementById('btn-spin-action').style.display = 'block';
      
      saveState();
    }

    function updateSkipCounter() {
      const remaining = gameState.maxSkips - gameState.skipCount;
      document.getElementById('skip-counter').textContent = `Пропуски: ${remaining}/${gameState.maxSkips}`;
      if (remaining <= 0) {
        document.getElementById('btn-skip').disabled = true;
      } else {
        document.getElementById('btn-skip').disabled = false;
      }
    }

    // ====== СБРОС ======
    function resetAll() {
      gameState.mode = null;
      gameState.name1 = '';
      gameState.name2 = '';
      gameState.currentTurn = 1;
      gameState.skipCount = 0;
      gameState.usedCards = { truth: new Set(), dare: new Set() };
      gameState.currentCardType = null;
      gameState.currentCardText = '';
      gameState.isFirstWheel = true;
      
      clearSavedState();
      
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
      document.getElementById('input-name1').value = '';
      document.getElementById('input-name2').value = '';
      document.getElementById('btn-names-next').disabled = true;
      document.getElementById('wheel').style.transform = 'rotate(0deg)';
      document.getElementById('btn-spin').style.display = 'block';
      document.getElementById('btn-wheel-continue').style.display = 'none';
      document.getElementById('wheel-result').textContent = '';
      
      showScreen('screen-names');
    }

    // ====== ВОССТАНОВЛЕНИЕ ======
    function restoreGame() {
      if (loadState()) {
        if (gameState.name1 && gameState.name2) {
          document.getElementById('input-name1').value = gameState.name1;
          document.getElementById('input-name2').value = gameState.name2;
          document.getElementById('btn-names-next').disabled = false;
          
          if (gameState.mode) {
            document.querySelector(`.mode-card[data-mode="${gameState.mode}"]`).classList.add('selected');
            document.getElementById('btn-mode-next').disabled = false;
            
            // Если игра была начата, возвращаемся в игру
            if (gameState.currentCardText || gameState.isFirstWheel === false) {
              goToGame();
            }
          }
        }
      }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
      restoreGame();
      if (!gameState.name1 || !gameState.name2) {
        showScreen('screen-names');
      }
    });
  </script>
</body>
</html>
