<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Правда или Наказание · для компании</title>
  <style>
    :root {
      --bg: #0f0a14;
      --bg-card: rgba(20, 12, 28, 0.4);
      --primary: #ff4d7d;
      --primary-light: #ff8ba7;
      --accent: #ffd166;
      --purple: #b44dff;
      --text: #fbe9f0;
      --text-soft: #c9b0bd;
      --text-muted: #8a6a7a;
      --border: rgba(255, 77, 125, 0.25);
      --glow: rgba(255, 77, 125, 0.15);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      --radius: 24px;
      --radius-sm: 16px;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('photo.png') center/cover no-repeat;
      filter: brightness(0.5) saturate(0.8);
      z-index: -3;
    }

    .gradient-overlay {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, 
        #ff6b6b, #ff9a9e, #fecfef, #a8edea, #fddb92, 
        #d4fc79, #96e6a1, #84fab0, #8fd3f4, #a18cd1, 
        #fbc2eb, #f6d365, #fda085, #f6d365, #ff6b6b
      );
      background-size: 600% 600%;
      animation: rainbowGradient 20s ease infinite;
      z-index: -2;
      pointer-events: none;
      opacity: 0.15;
    }

    @keyframes rainbowGradient {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 100%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 0%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 15, 0.4);
      z-index: -1;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 30px 25px;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      animation: fadeIn 0.5s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }

    .screen::-webkit-scrollbar { width: 4px; }
    .screen::-webkit-scrollbar-track { background: transparent; }
    .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-title {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleGradient 8s ease infinite;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    @keyframes titleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-subtitle {
      text-align: center;
      color: var(--text-soft);
      margin-bottom: 20px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 400px;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.5s;
      transform: translate(-50%, -50%);
    }
    .btn:active::after { width: 300px; height: 300px; }

    .btn-primary {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.8), rgba(255, 159, 243, 0.7));
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
    }
    .btn-secondary:hover {
      border-color: #ff9ff3;
      color: var(--text);
      background: rgba(255, 159, 243, 0.1);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-back {
      display: inline-block;
      width: auto;
      padding: 8px 16px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-bottom: 14px;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn-back:hover { border-color: #ff9ff3; color: var(--text); }

    .mode-grid {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      justify-content: center;
    }
    .mode-card {
      flex: 1;
      min-width: 150px;
      max-width: 200px;
      padding: 18px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .mode-card:hover { border-color: #ff9ff3; background: rgba(255, 159, 243, 0.1); }
    .mode-card.selected {
      border-color: #ff9ff3;
      background: rgba(255, 159, 243, 0.15);
      box-shadow: 0 0 20px rgba(255, 159, 243, 0.2);
    }
    .mode-icon { font-size: 2.2rem; margin-bottom: 6px; }
    .mode-name { font-weight: 600; font-size: 1rem; }

    .player-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .player-input-row input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .player-input-row input:focus { border-color: #ff9ff3; box-shadow: 0 0 15px rgba(255, 159, 243, 0.2); }
    .player-input-row .remove-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .player-input-row .remove-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
    }

    .add-player-btn {
      display: inline-block;
      width: auto;
      padding: 10px 20px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 30px;
      margin-top: 5px;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .add-player-btn:hover { border-color: #ff9ff3; color: var(--text); background: rgba(255, 159, 243, 0.1); }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 500px;
      width: 100%;
    }
    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255, 159, 243, 0.1);
      padding: 8px 14px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .turn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff9ff3;
      box-shadow: 0 0 8px #ff9ff3;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .skip-counter {
      font-size: 0.75rem;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 20px 18px;
      margin: 14px 0;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.5;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      word-wrap: break-word;
      transition: all var(--transition);
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card.pop { animation: cardPop 0.4s ease; }
    @keyframes cardPop {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .card.super-task {
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.1);
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      max-width: 500px;
      width: 100%;
      justify-content: center;
    }
    .action-buttons .btn {
      flex: 1;
      min-width: 120px;
      max-width: 200px;
      margin-bottom: 0;
      font-size: 0.8rem;
      padding: 12px 14px;
    }

    @media (max-width: 480px) {
      .screen { padding: 20px 15px; }
      .app-title { font-size: 1.5rem; }
      .card { font-size: 1rem; padding: 14px 10px; }
      .btn { padding: 12px 15px; font-size: 0.85rem; max-width: 350px; }
      .mode-card { min-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="gradient-overlay"></div>
  <div class="app">
    <div id="screen-players" class="screen active">
      <h1 class="app-title">✨ Правда или Наказание</h1>
      <p class="app-subtitle">Добавьте игроков (от 2 до 10)</p>
      <div id="players-container"></div>
      <button class="add-player-btn" id="add-player-btn" onclick="addPlayer()">+ Добавить игрока</button>
      <button class="btn btn-primary" style="margin-top: 16px;" id="btn-players-next" disabled onclick="goToMode()">Продолжить</button>
    </div>

    <div id="screen-mode" class="screen">
      <button class="btn-back" onclick="showScreen('screen-players')">← Назад</button>
      <h1 class="app-title">Выберите режим</h1>
      <p class="app-subtitle">Как будете играть?</p>
      <div class="mode-grid">
        <div class="mode-card" data-mode="regular" onclick="selectMode('regular')">
          <div class="mode-icon">💖</div>
          <div class="mode-name">Обычная</div>
        </div>
        <div class="mode-card" data-mode="adult" onclick="selectMode('adult')">
          <div class="mode-icon">🔥</div>
          <div class="mode-name">18+</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-mode-next" disabled onclick="goToGame()">Продолжить</button>
    </div>

    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="turn-indicator">
          <span class="turn-dot"></span>
          <span id="current-turn-name">—</span>
        </div>
        <span class="skip-counter" id="skip-counter">Пропуски: 3/3</span>
      </div>
      <div class="card" id="card-text">Выберите действие</div>
      <div class="action-buttons" id="choice-buttons" style="display: flex;">
        <button class="btn btn-primary" onclick="drawCard('truth')">💖 Правда</button>
        <button class="btn btn-primary" onclick="drawCard('dare')">🔥 Наказание</button>
      </div>
      <div class="action-buttons" id="action-buttons" style="display: none;">
        <button class="btn btn-secondary" onclick="skipCard()">Пропустить</button>
        <button class="btn btn-primary" onclick="completeCard()">Выполнил(а) ✓</button>
      </div>
      <button class="btn btn-secondary" style="margin-top: 8px;" onclick="resetAll()">🔄 Начать заново</button>
    </div>
  </div>

  <script>
    // ====== УМНАЯ АВТОГЕНЕРАЦИЯ ======
    const smartGenerator = {
      regular: {
        truth: {
          templates: [
            {
              pattern: "Что ты чувствуешь, когда {subject} {verb}?",
              subjects: ["{name}", "ты"],
              verbs: [
                "смотрит тебе в глаза", "улыбается тебе", "обнимает тебя",
                "держит тебя за руку", "шепчет тебе на ухо", "гладит тебя по волосам",
                "целует тебя в лоб", "говорит комплимент", "смеётся с тобой",
                "заботится о тебе", "приходит к тебе", "звонит тебе"
              ]
            },
            {
              pattern: "Что для тебя значит, когда {subject} {verb}?",
              subjects: ["{name}", "ты"],
              verbs: [
                "рядом", "поддерживает тебя", "верит в тебя", "понимает тебя",
                "прощает тебя", "ждёт тебя", "скучает по тебе", "гордится тобой",
                "помогает тебе", "защищает тебя", "вдохновляет тебя", "радует тебя"
              ]
            },
            {
              pattern: "Что бы ты сделал(а), если бы {situation}?",
              situations: [
                "{name} было грустно", "{name} заболел(а)", "{name} уехал(а) надолго",
                "{name} потерял(а) что-то важное", "{name} получил(а) повышение",
                "{name} выиграл(а) в лотерею", "{name} испугался(лась)",
                "{name} нуждался(лась) в помощи", "{name} забыл(а) про важную дату",
                "{name} приготовил(а) тебе сюрприз", "{name} признался(лась) в любви"
              ]
            },
            {
              pattern: "Как ты понимаешь, что {statement}?",
              statements: [
                "{name} тебя любит", "{name} тебе доверяет", "{name} тобой гордится",
                "{name} по тебе скучает", "{name} тебя ценит", "{name} тебя уважает",
                "{name} тебя ревнует", "{name} тебя простил(а)", "{name} тебе благодарен(на)",
                "{name} тебя хочет видеть", "{name} тебе рад(а)", "{name} тебя ждёт"
              ]
            },
            {
              pattern: "Что тебя больше всего привлекает в {aspect}?",
              aspects: [
                "характере {name}", "внешности {name}", "улыбке {name}",
                "голосе {name}", "походке {name}", "чувстве юмора {name}",
                "интеллекте {name}", "доброте {name}", "заботе {name}",
                "внимании {name}", "надёжности {name}", "честности {name}"
              ]
            },
            {
              pattern: "Какой момент с {name} для тебя самый {adjective}?",
              adjectives: [
                "ценный", "запоминающийся", "трогательный", "смешной",
                "романтичный", "неожиданный", "тёплый", "волнующий",
                "радостный", "спокойный", "страстный", "нежный"
              ]
            },
            {
              pattern: "Что бы ты хотел(а) {action} с {name}?",
              actions: [
                "сделать", "попробовать", "узнать", "обсудить",
                "спланировать", "построить", "создать", "пережить",
                "разделить", "открыть", "исследовать", "достичь"
              ]
            },
            {
              pattern: "Как {name} {verb} на твою жизнь?",
              verbs: [
                "влияет", "воздействует", "меняет", "улучшает",
                "вдохновляет", "обогащает", "наполняет", "украшает",
                "преображает", "дополняет", "развивает", "поддерживает"
              ]
            }
          ]
        },
        dare: {
          templates: [
            {
              pattern: "{action} {target} {manner}",
              actions: ["Обними", "Поцелуй", "Погладь", "Прикоснись к", "Подержи"],
              targets: ["{name}", "руку {name}", "плечо {name}", "щеку {name}", "волосы {name}"],
              manners: ["нежно", "крепко", "игриво", "застенчиво", "романтично", "тепло"]
            },
            {
              pattern: "Скажи {name}, {compliment}",
              compliments: [
                "что он(а) особенный(ая)", "что ты благодарен(на) за него/неё",
                "что он(а) красиво выглядит", "что он(а) умный(ая)",
                "что он(а) делает тебя счастливым(ой)", "что ты скучал(а) бы без него/неё",
                "что он(а) лучший(ая)", "что ты его/её ценишь",
                "что он(а) талантлив(ая)", "что он(а) заботливый(ая)"
              ]
            },
            {
              pattern: "Сделай {name} {action}",
              actions: [
                "массаж плеч", "массаж спины", "массаж рук", "комплимент",
                "сюрприз", "подарок", "завтрак", "ужин", "чай", "открытку"
              ]
            },
            {
              pattern: "Покажи {name}, {action}",
              actions: [
                "как сильно ты его/её любишь", "что ты о нём/ней думаешь",
                "свою лучшую улыбку", "свой лучший танец", "что ты умеешь",
                "что ты ценишь его/её", "что ты готов(а) на всё",
                "что ты скучал(а)", "что ты рад(а) его/её видеть"
              ]
            },
            {
              pattern: "Прошепчи {name} на ухо: {phrase}",
              phrases: [
                "«ты моё всё»", "«я тебя люблю»", "«спасибо, что ты есть»",
                "«ты моя радость»", "«я скучал(а) по тебе»", "«ты мой мир»",
                "«ты моё счастье»", "«ты моя судьба»", "«ты мой ангел»",
                "«ты моя жизнь»"
              ]
            }
          ]
        }
      },
      adult: {
        truth: {
          templates: [
            {
              pattern: "Что тебя больше всего возбуждает в {aspect}?",
              aspects: [
                "{name}", "теле {name}", "голосе {name}", "запахе {name}",
                "прикосновениях {name}", "поцелуях {name}", "взгляде {name}",
                "движениях {name}", "стонах {name}", "фантазиях о {name}"
              ]
            },
            {
              pattern: "Какая твоя самая смелая фантазия с {name}?",
              variants: [
                "Какая твоя самая смелая фантазия с {name}?",
                "Какая твоя тайная фантазия о {name}?",
                "Какая твоя грязная фантазия про {name}?",
                "Какая твоя эротическая мечта с {name}?"
              ]
            },
            {
              pattern: "Где бы ты хотел(а) заняться сексом с {name}?",
              variants: [
                "Где бы ты хотел(а) заняться сексом с {name}?",
                "В каком месте ты мечтаешь о близости с {name}?",
                "Где бы ты хотел(а) уединиться с {name}?"
              ]
            },
            {
              pattern: "Что бы ты хотел(а), чтобы {name} {action}?",
              actions: [
                "сделал(а) с тобой в постели", "сделал(а) с твоим телом",
                "сделал(а) языком", "сделал(а) руками", "сделал(а) губами",
                "сделал(а) с твоей шеей", "сделал(а) с твоей грудью",
                "сделал(а) с твоими бёдрами", "сделал(а) с твоей попой",
                "сделал(а) с твоими гениталиями", "прошептал(а) тебе",
                "снял(а) с тебя"
              ]
            },
            {
              pattern: "Что тебе нравится больше: когда {name} {action1} или {action2}?",
              pairs: [
                ["доминирует", "подчиняется"],
                ["шепчет", "стонет"],
                ["медленный", "быстрый"],
                ["нежный", "грубый"],
                ["сверху", "снизу"],
                ["целует", "кусает"],
                ["гладит", "царапает"],
                ["смотрит в глаза", "закрывает глаза"]
              ]
            },
            {
              pattern: "Как {name} должен(на) {action}?",
              actions: [
                "тебя соблазнять", "тебя целовать", "тебя ласкать",
                "тебя трогать", "тебя раздевать", "тебя возбуждать",
                "тебя удовлетворять", "тебя удивлять в постели",
                "делать тебе минет/куни", "доводить тебя до оргазма"
              ]
            },
            {
              pattern: "Что для тебя идеальная {thing} с {name}?",
              things: [
                "ночь страсти", "прелюдия", "близость", "интимная игра",
                "романтическая встреча", "сексуальная фантазия", "эротическая сцена"
              ]
            }
          ]
        },
        dare: {
          templates: [
            {
              pattern: "{action} {target} {manner}",
              actions: ["Поцелуй", "Лизни", "Укуси", "Погладь", "Прикоснись к", "Ласкай"],
              targets: [
                "{name} в губы", "{name} в шею", "{name} в ухо", "{name} в грудь",
                "{name} в живот", "{name} в спину", "{name} в бёдра",
                "{name} в ключицу", "{name} в запястье", "{name} в плечо",
                "тело {name}", "волосы {name}", "колени {name}", "ступни {name}"
              ],
              manners: ["страстно", "нежно", "медленно", "игриво", "дерзко", "чувственно"]
            },
            {
              pattern: "Сними с {name} {item}",
              items: [
                "одну деталь одежды", "рубашку", "штаны", "юбку", "платье",
                "нижнее бельё", "бюстгальтер", "трусы", "носки", "ремень",
                "обувь", "украшения"
              ]
            },
            {
              pattern: "Сделай {name} {action}",
              actions: [
                "эротический массаж", "массаж бёдер", "массаж спины",
                "массаж груди", "массаж ягодиц", "массаж внутренней части бедра",
                "массаж ступней", "массаж шеи", "массаж рук"
              ]
            },
            {
              pattern: "Прошепчи {name} на ухо: {phrase}",
              phrases: [
                "что ты его/её хочешь", "грязную фразу", "что ты хочешь с ним/ней сделать",
                "что он(а) сексуальный(ая)", "что тебе нравится в его/её теле",
                "что ты мечтаешь о нём/ней", "что ты хочешь его/её прямо сейчас"
              ]
            },
            {
              pattern: "Соблазни {name} {manner}",
              manners: [
                "взглядом", "улыбкой", "движениями", "танцем", "походкой",
                "прикосновением", "шёпотом", "жестом", "позой", "намёком"
              ]
            },
            {
              pattern: "Сядь {position} к {name}",
              positions: [
                "на колени", "сверху", "на бёдра", "рядом", "на живот",
                "на грудь", "на лицо", "на попу", "на ноги", "на руки"
              ]
            }
          ]
        }
      }
    };

    // ====== СОСТОЯНИЕ ======
    let gameState = {
      mode: null,
      players: [],
      currentPlayerIndex: 0,
      skipCount: 0,
      maxSkips: 3,
      usedCards: { truth: new Set(), dare: new Set() },
      currentCardType: null
    };

    // ====== ФУНКЦИЯ ГЕНЕРАЦИИ ======
    function generateSmartCard(type) {
      const modeData = smartGenerator[gameState.mode];
      const typeData = modeData[type];
      const otherName = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
      
      let text = '';
      let attempts = 0;
      const maxAttempts = 100;
      
      do {
        const template = typeData.templates[Math.floor(Math.random() * typeData.templates.length)];
        
        if (template.variants) {
          text = template.variants[Math.floor(Math.random() * template.variants.length)];
        } else if (template.pairs) {
          const pair = template.pairs[Math.floor(Math.random() * template.pairs.length)];
          text = template.pattern
            .replace('{action1}', pair[0])
            .replace('{action2}', pair[1]);
        } else {
          text = template.pattern;
          const keys = Object.keys(template).filter(k => k !== 'pattern' && Array.isArray(template[k]));
          keys.forEach(key => {
            const options = template[key];
            const value = options[Math.floor(Math.random() * options.length)];
            text = text.replace(`{${key}}`, value);
          });
        }
        
        text = text.replace(/{name}/g, otherName);
        attempts++;
      } while (gameState.usedCards[type].has(text) && attempts < maxAttempts);
      
      gameState.usedCards[type].add(text);
      gameState.currentCardType = type;
      return text;
    }

    // ====== СОХРАНЕНИЕ ======
    function saveState() {
      localStorage.setItem('truthOrDareState', JSON.stringify({
        mode: gameState.mode,
        players: gameState.players,
        currentPlayerIndex: gameState.currentPlayerIndex,
        skipCount: gameState.skipCount,
        usedTruth: Array.from(gameState.usedCards.truth),
        usedDare: Array.from(gameState.usedCards.dare)
      }));
    }

    function loadState() {
      const saved = localStorage.getItem('truthOrDareState');
      if (saved) {
        const s = JSON.parse(saved);
        gameState.mode = s.mode;
        gameState.players = s.players || [];
        gameState.currentPlayerIndex = s.currentPlayerIndex || 0;
        gameState.skipCount = s.skipCount || 0;
        gameState.usedCards.truth = new Set(s.usedTruth || []);
        gameState.usedCards.dare = new Set(s.usedDare || []);
        return true;
      }
      return false;
    }

    // ====== ИГРОКИ ======
    function addPlayer(name = '') {
      if (gameState.players.length >= 10) return;
      gameState.players.push(name);
      renderPlayers();
      updateNextButton();
    }

    function removePlayer(index) {
      if (gameState.players.length <= 2) return;
      gameState.players.splice(index, 1);
      renderPlayers();
      updateNextButton();
    }

    function renderPlayers() {
      const container = document.getElementById('players-container');
      container.innerHTML = '';
      gameState.players.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
          <input type="text" placeholder="Игрок ${i+1}" value="${p}" maxlength="20" oninput="updatePlayerName(${i}, this.value)">
          ${gameState.players.length > 2 ? `<button class="remove-btn" onclick="removePlayer(${i})">×</button>` : ''}
        `;
        container.appendChild(row);
      });
    }

    function updatePlayerName(i, val) {
      gameState.players[i] = val.trim();
      updateNextButton();
    }

    function updateNextButton() {
      const valid = gameState.players.length >= 2 && gameState.players.every(p => p.trim());
      document.getElementById('btn-players-next').disabled = !valid;
    }

    function goToMode() {
      saveState();
      showScreen('screen-mode');
    }

    function selectMode(mode) {
      gameState.mode = mode;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-mode-next').disabled = false;
    }

    function goToGame() {
      gameState.currentPlayerIndex = Math.floor(Math.random() * gameState.players.length);
      document.getElementById('current-turn-name').textContent = gameState.players[gameState.currentPlayerIndex];
      updateSkipCounter();
      document.getElementById('card-text').textContent = 'Выберите действие';
      document.getElementById('card-text').className = 'card';
      document.getElementById('choice-buttons').style.display = 'flex';
      document.getElementById('action-buttons').style.display = 'none';
      saveState();
      showScreen('screen-game');
    }

    function drawCard(type) {
      const cardText = generateSmartCard(type);
      document.getElementById('card-text').textContent = cardText;
      document.getElementById('card-text').className = 'card pop';
      document.getElementById('choice-buttons').style.display = 'none';
      document.getElementById('action-buttons').style.display = 'flex';
    }

    function skipCard() {
      if (gameState.skipCount >= gameState.maxSkips - 1 && gameState.mode === 'adult' && gameState.currentCardType === 'dare') {
        const other = gameState.players[(gameState.currentPlayerIndex + 1) % gameState.players.length];
        document.getElementById('card-text').textContent = `🔥 СУПЕР-ЗАДАНИЕ! Сделай ${other} минет или куни!`;
        document.getElementById('card-text').className = 'card super-task';
        gameState.skipCount++;
        updateSkipCounter();
        return;
      }
      if (gameState.skipCount >= gameState.maxSkips) return;
      gameState.skipCount++;
      updateSkipCounter();
      const cardText = generateSmartCard(gameState.currentCardType);
      document.getElementById('card-text').textContent = cardText;
      document.getElementById('card-text').className = 'card pop';
    }

    function completeCard() {
      gameState.skipCount = 0;
      updateSkipCounter();
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      document.getElementById('current-turn-name').textContent = gameState.players[gameState.currentPlayerIndex];
      document.getElementById('card-text').textContent = 'Выберите действие';
      document.getElementById('card-text').className = 'card';
      document.getElementById('choice-buttons').style.display = 'flex';
      document.getElementById('action-buttons').style.display = 'none';
      saveState();
    }

    function updateSkipCounter() {
      document.getElementById('skip-counter').textContent = `Пропуски: ${gameState.maxSkips - gameState.skipCount}/${gameState.maxSkips}`;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function resetAll() {
      localStorage.removeItem('truthOrDareState');
      gameState = {
        mode: null, players: [], currentPlayerIndex: 0, skipCount: 0, maxSkips: 3,
        usedCards: { truth: new Set(), dare: new Set() }, currentCardType: null
      };
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-mode-next').disabled = true;
      addPlayer();
      addPlayer();
      showScreen('screen-players');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (loadState() && gameState.players.length > 0) {
        renderPlayers();
        updateNextButton();
        showScreen('screen-players');
      } else {
        addPlayer();
        addPlayer();
        showScreen('screen-players');
      }
    });
  </script>
</body>
</html>
