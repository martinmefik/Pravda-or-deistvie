<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 ПРАВДА ИЛИ НАКАЗАНИЕ 18+</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a0b1f 0%, #0d020f 50%, #2a0a1e 100%);
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f5e9f8;
    }

    .game-container {
      width: 100%;
      max-width: 680px;
      background: rgba(20, 5, 25, 0.9);
      border: 2px solid #ff3b6f;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(255, 40, 90, 0.5);
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 10px;
      color: #ff4d6d;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
    }

    .subhead {
      text-align: center;
      color: #ffb3c6;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(40, 15, 45, 0.8);
      padding: 15px 20px;
      border-radius: 50px;
      margin-bottom: 30px;
      border: 1px solid #ff4d6d;
    }

    .toggle-label {
      font-weight: bold;
      font-size: 1.2rem;
    }

    .toggle-switch {
      position: relative;
      width: 60px;
      height: 32px;
      background: #3a1b2e;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .toggle-switch::after {
      content: "18+";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      background: #b9b0c0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      font-weight: bold;
      transition: all 0.3s;
    }

    .toggle-switch.active {
      background: #ff2e63;
      box-shadow: 0 0 20px #ff2e63;
    }

    .toggle-switch.active::after {
      left: 32px;
      background: #1e0010;
      color: #ffb3c6;
    }

    .players-input {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      gap: 15px;
    }

    .input-field {
      flex: 1;
      background: rgba(20, 8, 28, 0.8);
      border: 2px solid #ff4d6d;
      border-radius: 50px;
      padding: 15px 20px;
      font-size: 1rem;
      color: #ffe5f1;
      outline: none;
    }

    .input-field::placeholder {
      color: #b48ea5;
    }

    .input-field:focus {
      border-color: #ff5e7e;
      box-shadow: 0 0 20px rgba(255, 70, 120, 0.5);
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .btn {
      background: linear-gradient(135deg, #ff4d6d, #ff2e63);
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      font-weight: bold;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(255, 46, 99, 0.5);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 46, 99, 0.8);
    }

    .btn:active {
      transform: translateY(0);
    }

    .card {
      background: rgba(15, 3, 18, 0.9);
      border: 2px solid #ff5e7e;
      border-radius: 25px;
      padding: 30px;
      margin: 30px 0;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.5;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(255, 40, 90, 0.4);
    }

    .participants {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .chip {
      background: #2f0a25;
      padding: 10px 25px;
      border-radius: 40px;
      font-weight: bold;
      border: 1px solid #ff4d6d;
    }

    @media (max-width: 480px) {
      .game-container {
        padding: 20px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      .btn-group {
        flex-direction: column;
      }
      
      .card {
        font-size: 1.2rem;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🔥 ПРАВДА ИЛИ НАКАЗАНИЕ 🔥</h1>
    <div class="subhead">для пар · уникальные карты · без повторов</div>

    <div class="toggle-wrapper">
      <span class="toggle-label">🔞 18+ режим</span>
      <div class="toggle-switch" id="toggleSwitch" onclick="toggleAdult()"></div>
    </div>

    <div class="players-input">
      <div class="input-group">
        <input type="text" id="player1" class="input-field" placeholder="Имя партнёра 1">
        <input type="text" id="player2" class="input-field" placeholder="Имя партнёра 2">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="showTruth()">ПРАВДА</button>
      <button class="btn" onclick="showDare()">НАКАЗАНИЕ</button>
      <button class="btn" onclick="resetGame()">🔄 НОВАЯ ПАРА</button>
    </div>

    <div class="card" id="questionCard">
      Нажмите «Правда» или «Наказание»
    </div>

    <div class="participants">
      <span class="chip" id="participant1">Партнёр 1</span>
      <span class="chip" id="participant2">Партнёр 2</span>
    </div>
  </div>

  <script>
    let isAdultMode = false;
    let usedTruthRegular = new Set();
    let usedDareRegular = new Set();
    let usedTruthAdult = new Set();
    let usedDareAdult = new Set();

    const truthRegular = [
      "Какой твой самый неловкий момент на первом свидании?",
      "Что тебя больше всего заводит в партнёре?",
      "Расскажи о своём первом поцелуе с партнёром.",
      "Какая твоя тайная фантазия?",
      "Что для тебя идеальный романтический вечер?",
      "Когда ты в последний раз ревновал(а)?",
      "Назови три вещи, которые тебя раздражают в партнёре.",
      "Какой твой самый большой страх в отношениях?",
      "Что ты чувствуешь, когда партнёр обнимает тебя?",
      "Какая твоя привычка, о которой партнёр не знает?"
    ];

    const dareRegular = [
      "Поцелуй партнёра в шею.",
      "Скажи партнёру самый сокровенный комплимент.",
      "Сделай партнёру массаж плеч 1 минуту.",
      "Признайся в чём-то, что никогда не говорил(а).",
      "Потанцуй медленный танец без музыки.",
      "Напиши пальцем на спине партнёра признание.",
      "Позволь партнёру задать тебе любой вопрос.",
      "Покорми партнёра с закрытыми глазами.",
      "Прошепчи на ухо партнёру комплимент.",
      "Сделай вид, что вы не виделись месяц."
    ];

    const truthAdult = [
      "Какая твоя самая грязная фантазия с партнёром?",
      "Что бы ты хотел(а), чтобы партнёр сделал с тобой?",
      "Расскажи о своём самом горячем сне.",
      "Какой звук тебя больше всего возбуждает?",
      "Где бы ты хотел(а) заняться сексом?",
      "Что для тебя идеальная прелюдия?",
      "Какой элемент одежды тебя заводит?",
      "Назови три позы, которые хочешь попробовать.",
      "Что тебе нравится больше: доминировать или подчиняться?",
      "Какой интимный момент хочешь повторить?"
    ];

    const dareAdult = [
      "Медленно поцелуй партнёра в шею.",
      "Сними одну деталь одежды с партнёра.",
      "Прошепчи партнёру грязную фразу.",
      "Сделай эротический массаж 2 минуты.",
      "Покажи, как соблазняешь партнёра.",
      "Поцелуй партнёра страстно.",
      "Сядь на колени к партнёру.",
      "Сделай партнёру укус в шею.",
      "Прикоснись к чувствительной зоне партнёра.",
      "Соблазни партнёра только взглядом."
    ];

    function toggleAdult() {
      isAdultMode = !isAdultMode;
      const toggle = document.getElementById('toggleSwitch');
      if (isAdultMode) {
        toggle.classList.add('active');
      } else {
        toggle.classList.remove('active');
      }
    }

    function getRandomUnique(usedSet, array) {
      if (usedSet.size >= array.length) {
        usedSet.clear();
      }
      
      let available = [];
      for (let i = 0; i < array.length; i++) {
        if (!usedSet.has(i)) {
          available.push(i);
        }
      }
      
      if (available.length === 0) {
        usedSet.clear();
        available = Array.from({length: array.length}, (_, i) => i);
      }
      
      const randomIndex = available[Math.floor(Math.random() * available.length)];
      usedSet.add(randomIndex);
      return array[randomIndex];
    }

    function showTruth() {
      updateNames();
      const card = document.getElementById('questionCard');
      if (isAdultMode) {
        card.textContent = getRandomUnique(usedTruthAdult, truthAdult);
      } else {
        card.textContent = getRandomUnique(usedTruthRegular, truthRegular);
      }
    }

    function showDare() {
      updateNames();
      const card = document.getElementById('questionCard');
      if (isAdultMode) {
        card.textContent = getRandomUnique(usedDareAdult, dareAdult);
      } else {
        card.textContent = getRandomUnique(usedDareRegular, dareRegular);
      }
    }

    function resetGame() {
      usedTruthRegular.clear();
      usedDareRegular.clear();
      usedTruthAdult.clear();
      usedDareAdult.clear();
      
      document.getElementById('player1').value = '';
      document.getElementById('player2').value = '';
      document.getElementById('participant1').textContent = 'Партнёр 1';
      document.getElementById('participant2').textContent = 'Партнёр 2';
      document.getElementById('questionCard').textContent = 'Нажмите «Правда» или «Наказание»';
    }

    function updateNames() {
      const p1 = document.getElementById('player1').value.trim();
      const p2 = document.getElementById('player2').value.trim();
      
      if (p1) {
        document.getElementById('participant1').textContent = p1;
      }
      if (p2) {
        document.getElementById('participant2').textContent = p2;
      }
    }
  </script>
</body>
</html>
